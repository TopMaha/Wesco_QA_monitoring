ALLOWED_ORIGINS = "https://topmaha.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Secret (set once with `wrangler secret put TOKEN_SECRET`):
#   TOKEN_SECRET — random string used to sign login tokens
